  positive_examples:
  - The company may share personal information with third parties hired to perform services, under strict conditions.
  - The company uses third party service providers to perform various functions on its behalf.
  near_miss: The company may share personal information with business partners to fulfill requests for products or services.
  severity_weight: 1.5
  section_hint: in the first half of the document
