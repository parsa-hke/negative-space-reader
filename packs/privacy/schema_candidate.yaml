  section_hint: under a heading like 'what do we use your information for', in the first half of the document
  label_source:
  - 'First Party Collection/Use :: Purpose = Analytics/Research'
  source_clusters:
  - c028
- id: uses_data_to_personalize
  name: uses_data_to_personalize
  definition: States that collected information is used to personalise or customise content, offers or the user's experience.
