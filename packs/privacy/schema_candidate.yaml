types:
- id: states_information_required_to_register
  name: states_information_required_to_register
  definition: States that users must create an account or register to use the service or parts of it, and which personal information
    they must provide to do so (mandatory fields), as opposed to information they may choose to give.
  positive_examples:
  - The company asks for specific personal information when users register.
  - The company requires users to provide personal information during registration.
  near_miss: The company collects personal information when users register or place an order on the site.
  severity_weight: 1.5
  section_hint: in the first half of the document
  label_source:
  - 'First Party Collection/Use :: Collection Mode = Explicit & User Type = User with account'
  source_clusters:
  - c021
- id: collects_usage_data_automatically
  name: collects_usage_data_automatically
  definition: States that the company automatically collects technical or usage data about visits (IP address, browser, pages
    viewed, log files) without the user entering it.
  positive_examples:
  - The company collects information about the number of users visiting the website and the number of pages viewed.
  - The company uses log files to collect various types of data for analyzing trends, administering the site, tracking user
    movement, and gathering demographic information.
  near_miss: The company uses web beacons to track user visits and email opens for analytics purposes.
  severity_weight: 1.5
  section_hint: in the first half of the document
  label_source:
  - 'First Party Collection/Use :: Collection Mode = Implicit & Personal Information Type = User online activities'
  - 'First Party Collection/Use :: Collection Mode = Implicit & Personal Information Type = IP address and device IDs'
  - 'First Party Collection/Use :: Collection Mode = Implicit & Personal Information Type = Computer information'
  source_clusters:
  - c001
  - c060
- id: uses_cookies
  name: uses_cookies
  definition: States that the company sets cookies or similar tracking technologies and what it uses them for (recognising
    users, remembering preferences, tracking visits).
  positive_examples:
  - The company uses cookies to identify which pages on their website have been accessed.
  - The company uses cookies and similar tracking technologies to access or store information.
  near_miss: The company mentions that third-party advertising and marketing partners may use their own cookies.
  severity_weight: 1.0
  section_hint: under a heading like 'cookies', in the first half of the document
  label_source:
  - 'First Party Collection/Use :: Personal Information Type = Cookies and tracking elements'
  source_clusters:
  - c000
  - c050
- id: uses_web_beacons
  name: uses_web_beacons
  definition: States that the company uses web beacons, pixel tags or clear GIFs (on pages or in emails) to collect information
    about visits or email opens; plain cookie statements are uses_cookies.
  positive_examples:
  - The company uses web beacons to track user visits and email opens for analytics purposes.
  - The company uses web beacons to track which visitors interact with specific elements on web pages or emails.
  near_miss: The company collects information about the number of users visiting the website and the number of pages viewed.
  severity_weight: 1.0
  section_hint: in the first half of the document
  label_source:
  - teacher
  source_clusters:
  - c052
- id: tracking_data_not_linked_to_identity
  name: tracking_data_not_linked_to_identity
  definition: States that cookies, IP addresses or other technical data are not linked to, or not used to identify, the person
    (except where stated).
  positive_examples:
  - The company does not link collected IP addresses and other information to personally identifiable information.
  - The company does not use cookies to collect personally identifiable information.
  near_miss: The company allows users to visit the site without providing personal information.
  severity_weight: 1.0
  section_hint: in the first half of the document
  label_source:
  - teacher
  source_clusters:
  - c027
  - c039
- id: defines_personal_information
  name: defines_personal_information
  definition: Defines terms used in the policy, most often what counts as personal (personally identifiable) information or
