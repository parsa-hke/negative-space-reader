  - The company may transfer personal information as part of a merger, acquisition, or sale of assets.
  near_miss: The company states that personal information may be transferred to, stored, or processed in the USA.
  severity_weight: 1.0
  section_hint: in the second half of the document
  label_source:
  - 'Third Party Sharing/Collection :: Purpose = Merger/Acquisition'
  source_clusters:
  - c033
- id: transfers_data_internationally
  name: transfers_data_internationally
  definition: States that personal information may be transferred to, stored or processed in another country (typically the
