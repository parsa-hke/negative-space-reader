- id: does_not_sell_or_share
  name: does_not_sell_or_share
  definition: States that the company does not sell, rent, trade or share personal information (or email addresses) with third
    parties, apart from any stated exceptions.
  positive_examples:
  - The company does not sell, rent, or trade personal information to third parties.
  - The company does not sell, trade, share, or rent the user's email address to anyone.
  near_miss: The company does not link collected IP addresses and other information to personally identifiable information.
  severity_weight: 1.5
