- id: scope_excludes_third_party_sites
  name: scope_excludes_third_party_sites
  definition: States that the policy applies only to the company's own sites and not to other websites or services, even linked
    ones.
  positive_examples:
  - The company's privacy policy applies only to its own website and not to other linked websites.
  - The company's privacy policy does not apply to external websites.
  near_miss: The company is not responsible for the content, policies, practices, or products of third-party websites.
  severity_weight: 1.0
  section_hint: in the first half of the document
  label_source:
  - teacher
  source_clusters:
  - c036
- id: third_party_sites_and_their_policies
  name: third_party_sites_and_their_policies
  definition: States that the site links to third-party websites, that the company is not responsible for their content or
    practices, and/or advises users to read their privacy policies.
  positive_examples:
  - The company is not responsible for the content, policies, practices, or products of third-party websites.
  - The company advises users to review the privacy policies of websites they link to.
  near_miss: The company has no access to or control over cookies used by third-party advertisers.
  severity_weight: 1.0
  section_hint: in the second half of the document
  label_source:
  - teacher
  source_clusters:
  - c009
  - c010
  - c064
- id: consent_by_use
  name: consent_by_use
  definition: States that using the site or giving information means consenting to the policy or to the collection and use
    it describes, or that users who do not agree should not use the site.
  positive_examples:
  - The company states that using the site implies consent to the privacy policy.
  - The company states that by using the site, users signify their acceptance of the privacy policy.
  near_miss: The company states that continued use of the Sites after changes to the Privacy Policy constitutes acceptance
    of the changes.
  severity_weight: 1.0
  section_hint: in the first half of the document
  label_source:
  - teacher
  source_clusters:
  - c029
- id: complies_with_laws_and_programs
  name: complies_with_laws_and_programs
  definition: States that the company complies with named privacy or marketing laws, frameworks, standards or self-regulatory
    programs (e.g. COPPA, CAN-SPAM, Safe Harbor/Privacy Shield, P3P, TRUSTe) and what that commits it to.
  positive_examples:
  - The company participates in and has certified compliance with the EU-U.S. Privacy Shield Framework.
  - The company complies with the Children's Online Privacy Protection Act and all other applicable laws.
  near_miss: The company commits to protecting the privacy and personal information of its users.
  severity_weight: 1.0
  section_hint: in the first half of the document
  label_source:
  - teacher
  source_clusters:
  - c038
- id: governing_law_and_disputes
  name: governing_law_and_disputes
  definition: States which jurisdiction's law governs the policy or site and how disputes are resolved.
  positive_examples:
  - The Privacy Policy is governed by the laws of a specific state.
  - The company states that the policy and use of the site are governed by New York law.
  near_miss: The company's privacy policy applies only to its own website and not to other linked websites.
  severity_weight: 1.0
  section_hint: in the second half of the document
  label_source:
  - teacher
  source_clusters:
  - c025
- id: provides_privacy_contact
  name: provides_privacy_contact
  definition: Tells readers how to contact the company about the policy or their information (email, address, phone, form,
    named contact person).
  positive_examples:
  - The company provides a contact method for questions about the privacy policy or services.
  - The company provides contact information for questions about privacy policy or practices.
  near_miss: The company uses information to contact users about relevant services and offers.
  severity_weight: 1.5
  section_hint: in the second half of the document
  label_source:
  - 'Other :: Other Type = Privacy contact information'
  source_clusters:
  - c014
  - c048
  - c071
- id: do_not_track_response
  name: do_not_track_response
  definition: States whether and how the company responds to browser Do Not Track signals (most often that it does not).
  positive_examples:
  - The company does not respond to browser 'Do Not Track' signals at this time.
  - The company honors do not track signals.
  near_miss: The company allows users to disable cookies through their web browser settings.
  severity_weight: 1.0
  section_hint: in or next to the cookies and tracking section, in the second half of the document
  label_source:
  - Do Not Track
  source_clusters: []
- id: california_disclosure_rights
  name: california_disclosure_rights
  definition: States the rights of California residents to learn which third parties received their information for direct
    marketing, and how to make the request.
  positive_examples:
  - The company discloses that California residents can request a list of third parties to which personal information was
    disclosed for direct marketing purposes.
  - California residents have the right to request a list of third parties to whom the company has disclosed personal information
    for direct marketing purposes.
  near_miss: The company allows individuals to complain to a data protection authority about their collection and use of personal
    information.
  severity_weight: 1.0
  section_hint: near the end, under a heading like 'Your California Privacy Rights'
  label_source:
  - 'International and Specific Audiences :: Audience Type = Californians'
  source_clusters: []
- id: data_collection_methods
  name: data_collection_methods
  definition: States that the company collects personal information from users through various activities on the website,
    such as registration, placing orders, or providing information.
  positive_examples:
  - The company collects personal information when users register or place an order on the site.
  - The company collects various types of personal information from users, including contact details and demographic information.
  near_miss: The company collects information about the number of users visiting the website and the number of pages viewed.
  severity_weight: 1.5
  section_hint: near the start of the document
  label_source:
  - 'First Party Collection/Use :: Collection Mode = Explicit & Does/Does Not = Does'
  source_clusters:
  - c002
- id: data_use_for_services
  name: data_use_for_services
  definition: States that the company uses collected personal information for providing products, services, processing orders,
    and customer support.
  positive_examples:
  - The company uses collected personal information to provide products and services, process orders, and offer customer service.
  - The company uses collected information to fulfill orders, provide quotes, process orders, notify about order status, prepare
    drawings, and provide information about offers or products.
  near_miss: The company uses collected information to improve the sites and services.
  severity_weight: 1.5
  section_hint: in the first half of the document
  label_source:
  - 'First Party Collection/Use :: Purpose = Basic service/feature'
  source_clusters:
  - c008
- id: policy_coverage
  name: policy_coverage
  definition: States that the privacy policy covers the collection, use, and handling of personal information, typically specifying
    the scope of the policy to include the company's websites, services, and sometimes its family of companies.
  positive_examples:
  - The company discloses that the privacy policy covers the collection, use, and choices about personal information collected
    on or through the services.
  - The company explains the scope of its privacy policy to cover personal information provided through its websites.
  near_miss: The company defines personal information as personally identifiable information about an individual.
  severity_weight: 1.0
  section_hint: near the start of the document
  label_source:
  - teacher
  source_clusters:
  - c011
- id: user_data_control
  name: user_data_control
  definition: States that users can review, update, correct or delete their personal information, how (account settings, contacting
    the company), and any conditions on such requests (identity verification, fees, limits).
  positive_examples:
  - The company allows users to update and correct their personal information at any time.
  - The company allows users to update or correct their personal information through their account or by contacting customer
    service.
  near_miss: The company allows users to choose whether to provide personal information.
  severity_weight: 1.5
  section_hint: in the second half of the document
  label_source:
  - 'User Access, Edit and Deletion :: Access Type = Edit information'
  - 'User Access, Edit and Deletion :: Access Type = View'
  source_clusters:
  - c012
- id: discloses_public_areas
  name: discloses_public_areas
  definition: States that information users post in public areas (forums, reviews, profiles) can be seen and used by others
    and may persist or be reposted after deletion, often with a warning to be careful.
  positive_examples:
  - The company allows users to set up public profiles that other users can view.
  - The company discloses that information posted in public areas of the sites is publicly available and may be viewed and
    shared by other users.
  near_miss: The company may share personal information with business partners to fulfill requests for products or services.
  severity_weight: 1.0
  section_hint: in the first half of the document
  label_source:
  - 'Third Party Sharing/Collection :: Third Party Entity = Public'
  - 'Third Party Sharing/Collection :: Third Party Entity = Other users'
  source_clusters:
  - c013
- id: disclose_data_rights
  name: disclose_data_rights
  definition: States the user's legal rights over their personal data as rights (access, correction, objection to processing,
    portability, withdrawing consent, complaining to a data protection authority).
  positive_examples:
  - The company allows individuals to complain to a data protection authority about their collection and use of personal information.
  - The company discloses that individuals have the right to raise a complaint with the data protection regulator.
  near_miss: The company provides a contact method for questions about the privacy policy or services.
  severity_weight: 1.5
  section_hint: in the second half of the document
  label_source:
  - teacher
  source_clusters:
  - c031
- id: content_and_usage_restrictions
  name: content_and_usage_restrictions
  definition: 'States the site''s terms of use or legal conditions rather than a data practice: rules for using the site or
    its content, disclaimers of liability (for example use at your own risk), indemnification or release, legal penalties,
    or that the policy creates no contractual rights.'
  positive_examples:
  - The company states that users are not allowed to submit content that violates or infringes the rights of others.
  - The company states that users may not modify, copy, reproduce, create derivative works, republish, display, upload, post,
    transmit, or distribute content without prior written consent.
  near_miss: The Privacy Policy is governed by the laws of a specific state.
  severity_weight: 1.0
  section_hint: in the second half of the document
  label_source:
  - teacher
  source_clusters:
  - c037
- id: data_collection_contests_surveys
  name: data_collection_contests_surveys
  definition: States that the company collects personal information from users through contests, surveys, and other similar
    activities on their website.
  positive_examples:
  - The company collects information when users participate in contests or promotions.
  - The company collects personal information when you participate in contests, promotions, or sweepstakes on their websites.
  near_miss: The company may send promotional emails about new products or special offers.
  severity_weight: 1.5
  section_hint: in the first half of the document
  label_source:
  - 'First Party Collection/Use :: Collection Mode = Explicit & Does/Does Not = Does'
  source_clusters:
  - c045
- id: company_identification_and_service_definition
  name: company_identification_and_service_definition
  definition: 'Identifies who operates the site and is responsible for the information: the company or organisation and its
    affiliates, responsible representatives (such as a director of publication), its address, or its registration with a data-protection
    authority; sometimes with the services the policy covers.'
  positive_examples:
  - The company identifies itself as the owner and operator of the website or online service.
  - The company defines the term 'Services' to include the websites, applications, and community features operated by the
    company.
  near_miss: The company uses third party service providers to perform various functions on its behalf.
  severity_weight: 1.5
  section_hint: under a heading like 'india', in the first half of the document
  label_source:
  - teacher
  source_clusters:
  - c047
- id: provides_third_party_links
  name: provides_third_party_links
  definition: States that the company includes or provides links to third-party websites, often advising users to review the
    privacy policies of those sites.
  positive_examples:
  - The company includes links to third-party sites on its website.
  - The company provides links to other websites.
  near_miss: The company states that third-party sites have separate and independent privacy policies.
  severity_weight: 1.0
  section_hint: in the second half of the document
  label_source:
  - teacher
  source_clusters:
  - c066
