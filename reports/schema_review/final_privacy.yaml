    into 'ad serving' and 'third-party cookies' if you want finer types; definition widened after the coverage check
- id: disclaims_control_of_third_party_cookies
  name: disclaims_control_of_third_party_cookies
  definition: States that the company has no access to or control over cookies and tracking used by third-party advertisers,
