  clusters:
  - c024
  - c055
  severity_weight: 1.5
  label_source:
  - 'Third Party Sharing/Collection :: Purpose = Basic service/feature & Does/Does Not = Does'
  - 'Third Party Sharing/Collection :: Purpose = Service operation and security & Does/Does Not = Does'
