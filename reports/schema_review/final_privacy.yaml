# Final reviewed checklist for privacy (task 3.4), generated by analysis/apply_review_decisions.py from
# reports/schema_review/decisions/page_answers_2026-10-15.json (Parsa's answers on the review page) and reports/schema_review/decisions/resolutions_2026-10-15.yaml. Do not edit by hand.
types:
- id: states_information_required_to_register
  name: states_information_required_to_register
  definition: States that users must create an account or register to use the service or parts of it, and which personal information
    they must provide to do so (mandatory fields), as opposed to information they may choose to give.
  clusters:
  - c021
  severity_weight: 1.5
  label_source:
  - 'First Party Collection/Use :: Collection Mode = Explicit & User Type = User with account'
  seeds:
  - first_party_collection_use
  notes: 'GDPR Art. 13(2)(e): whether providing the data is a requirement; definition widened after the coverage check'
- id: collects_usage_data_automatically
  name: collects_usage_data_automatically
  definition: States that the company automatically collects technical or usage data about visits (IP address, browser, pages
    viewed, log files) without the user entering it.
  clusters:
  - c001
  - c060
  severity_weight: 1.5
  label_source:
  - 'First Party Collection/Use :: Collection Mode = Implicit & Personal Information Type = User online activities'
  - 'First Party Collection/Use :: Collection Mode = Implicit & Personal Information Type = IP address and device IDs'
  - 'First Party Collection/Use :: Collection Mode = Implicit & Personal Information Type = Computer information'
  seeds:
  - first_party_collection_use
  notes: 'CCPA 1798.100(b): categories collected'
- id: uses_cookies
  name: uses_cookies
  definition: States that the company sets cookies or similar tracking technologies and what it uses them for (recognising
    users, remembering preferences, tracking visits).
  clusters:
  - c000
  - c050
  label_source:
  - 'First Party Collection/Use :: Personal Information Type = Cookies and tracking elements'
  seeds:
  - first_party_collection_use
- id: uses_web_beacons
  name: uses_web_beacons
  definition: States that the company uses web beacons, pixel tags or clear GIFs (on pages or in emails) to collect information
    about visits or email opens; plain cookie statements are uses_cookies.
  clusters:
  - c052
  label_source:
  - teacher
  seeds:
  - first_party_collection_use
- id: tracking_data_not_linked_to_identity
  name: tracking_data_not_linked_to_identity
  definition: States that cookies, IP addresses or other technical data are not linked to, or not used to identify, the person
    (except where stated).
  clusters:
  - c027
  - c039
  label_source:
  - teacher
  seeds:
  - first_party_collection_use
  notes: c027 was flagged mixed by the teacher (non-linking vs non-identification); both are the same promise
- id: defines_personal_information
  name: defines_personal_information
  definition: Defines terms used in the policy, most often what counts as personal (personally identifiable) information or
    anonymous information.
  clusters:
  - c069
  label_source:
  - teacher
  seeds:
  - other
  notes: definition widened after the coverage check
- id: uses_data_to_improve_services
  name: uses_data_to_improve_services
  definition: States that collected information is used to analyse, maintain or improve the website, services or user experience.
  clusters:
  - c028
  label_source:
  - 'First Party Collection/Use :: Purpose = Analytics/Research'
  seeds:
  - first_party_collection_use
- id: uses_data_to_personalize
  name: uses_data_to_personalize
  definition: States that collected information is used to personalise or customise content, offers or the user's experience.
  clusters:
  - c057
  label_source:
  - 'First Party Collection/Use :: Purpose = Personalization/Customization'
  seeds:
  - first_party_collection_use
- id: sends_marketing_communications
  name: sends_marketing_communications
  definition: States that the company uses contact details (mainly email) to send newsletters, promotions or other marketing
    communications about its own products and services.
  clusters:
  - c006
  - c032
  label_source:
  - 'First Party Collection/Use :: Purpose = Marketing'
  seeds:
  - first_party_collection_use
- id: does_not_sell_or_share
  name: does_not_sell_or_share
  definition: States that the company does not sell, rent, trade or share personal information (or email addresses) with third
    parties, apart from any stated exceptions.
  clusters:
  - c004
  - c043
  severity_weight: 1.5
  label_source:
  - 'Third Party Sharing/Collection :: Does/Does Not = Does Not'
  seeds:
  - third_party_sharing_collection
  notes: 'CCPA 1798.115/1798.120: disclosure of sale; the negative form is the common one in this pre-2020 corpus'
- id: shares_with_service_providers
  name: shares_with_service_providers
  definition: States that personal information is shared with, or processed by, third-party service providers acting on the
