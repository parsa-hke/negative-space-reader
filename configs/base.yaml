# Every tunable in the project (plan §1.4). Task configs `inherit: base.yaml` and set `task:`;
# mode and compute overlays (smoke, local, gpu, openrouter) are applied on top with `--overlay`.
# Defaults here are the LEAN tier (plan §0.2 #25, revised 2026-10-12): runs on the Mac, free demo.
# `--overlay full` flips every tiered key to the full tier. A null marked "Phase N" is fixed in that phase.
# Model ids were verified on the Hugging Face hub on 2026-10-12 (see CHANGELOG.md).

task: null                 # build_pack | induce | distil | train_mam | bench | baselines | drift | serve
pack: null                 # privacy | papers (pack-scoped tasks)
tier: lean                 # lean | full; informational, recorded in run metrics and pack manifests

run:
  name: null               # run directory prefix; default = config file stem
  seeds: [0, 1, 2]         # one run directory per seed: runs/<name>_s<seed>/
  deterministic: false     # torch.use_deterministic_algorithms(True)
  device: auto             # auto | cuda | mps | cpu
  devices: null            # several devices for data-parallel jobs (embedding), e.g. [cuda:0, cuda:1]

paths:
  data_raw: data/raw
  data_processed: data/processed
  splits: data/processed/splits
  packs: packs
  prompts: prompts
  runs: runs
  checkpoints: checkpoints
  cache: .cache/negspace   # embedding cache keyed by (model id, text hash), plan §5.1
  embeddings: data/embeddings
  figures: reports/figures
  tables: reports/tables

genres: [privacy, papers]

# ---------------------------------------------------------------- data (Phase 2)
corpus:
  max_documents_per_genre: 25000  # plan §0.2 #18: 20-30k indexable documents per genre; smoke = 200
  stratify_by: [year, category]
  snapshots_per_entity_per_year: 1
  keep_version_chains: true       # full chain of every sampled entity, for revisions and drift
  min_date: null                  # per-pack configs restrict (papers: 2018 onward)
  max_date: null

segment:
  sentence_splitter: rules        # data/segment.py; pysbd (333 sent/s) and spaCy's sentencizer rejected, CHANGELOG
  min_section_chars: 80
  max_section_chars: 8000         # longer sections are split on paragraph breaks
  fallback_section_chars: 1500    # documents with no detectable headings are chunked to about this size
  min_sentence_chars: 15
  remove_boilerplate: true

dedup:
  num_perm: 128                   # MinHash permutations
  shingle_size: 5                 # word n-grams
  jaccard_threshold: 0.85         # near-duplicate cut-off; Phase 2.6 reports rates at this value
  max_per_cluster_per_year: 1     # train: near-duplicate documents of different entities kept per cluster and year
  collapse_versions: true         # policy snapshots -> one entity with a version chain

revisions:                        # plan §2.6b; data/revisions.py
  same_threshold: 0.95            # consecutive versions at least this similar are one version
  min_change: 0.05                # 1 - Jaccard must be at least this (material edit) ...
  max_change: 0.90                # ... and at most this (otherwise a different page or an extraction failure)

data_sources:                     # plan §2.1; data/README.md documents every field used
  privacy:
    privacy_pl:
      db: data/raw/privacy_pl/release_db.sqlite
      analysis_subcorpus_only: true
      file_types: [HTML]
      min_year: null
    opp115:
      dir: data/raw/opp115
      consolidation_threshold: "0.75"
      split: dev                  # human labels train/calibrate presence heads; never indexed, never in test
  papers:
    unarxive:
      archive: data/raw/unarxive/unarXive_230324_open_subset.tar.xz
      extract: data/processed/papers/_extract/unarxive_cs_cl_lg_2018.jsonl.gz
      categories: [cs.CL, cs.LG]
      min_date: "2018-01-01"
      cutoff: "2022-12-31"        # the open subset holds arXiv sources up to this date
      min_paragraphs: 5           # papers whose LaTeX conversion yielded almost no body text are skipped
    arxiv_eprints:
      cache: data/raw/arxiv_eprints
      min_interval_s: 3.0         # one request per 3 s
      max_pairs: 600              # ~1 h at one request per 3 s; null = every multi-version test paper (cached, incremental)

splits:
  seed: 1234                      # fixed and separate from run seeds: the test split is sealed
  train: 0.80                     # indexable corpus
  dev: 0.10                       # schema induction samples, calibration
  test: 0.10                      # OmitBench documents, never indexed

# ---------------------------------------------------------------- models
models:
  teacher:                        # plan §0.2 #6; size decided in Phase 1.3 (see README "Compute")
    backend: vllm                 # vllm (in-process) | openai (any OpenAI-compatible server) | transformers (local stand-in)
    id: Qwen/Qwen2.5-72B-Instruct
    revision: null                # pin a commit sha at the start of Phase 3
    fallback_id: Qwen/Qwen2.5-32B-Instruct
    dtype: bfloat16
    quantization: null            # null | awq (set by the gpu overlay if the server needs it)
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.90
    max_model_len: 8192
    structured_backend: xgrammar  # plan §0.2 #6; fallback below
    structured_fallback: outlines
    temperature: 0.0
    top_p: 1.0
    max_tokens: 1024
    max_retries: 2                # re-ask on JSON / schema validation failure
    batch_size: 64
    cache: true                   # cache every response on disk: reruns are free and reproducible
    cache_dir: .cache/negspace/teacher
    base_url: null                # openai backend only (e.g. http://localhost:8000/v1 for `vllm serve`)
    api_key_env: null             # name of the env var holding the key, never the key itself
    response_format: json_schema  # openai backend: json_schema | json_object | none
    concurrency: 8                # openai backend: parallel requests
    request_timeout_s: 120
    provider: null                # OpenRouter routing, see configs/openrouter.yaml
  embedder:                       # plan §0.2 #9; lean = 0.6B (CPU-servable), full = 8B
    id: Qwen/Qwen3-Embedding-0.6B
    fallback_ids: [BAAI/bge-m3]
    dtype: float16
    max_length: 1024
    batch_size: 32
    normalize: true
    title_abstract_weight: 0.5    # document emb = (1-w) * mean(section embs) + w * title/abstract emb
  late_interaction:               # plan §0.2 #8 step 1; lean = Apache-2.0 small ColBERT, full = Jina (CC-BY-NC)
    id: answerdotai/answerai-colbert-small-v1
    revision: 934fa8bb4ce2284f4c2baa232d81aca4d076fa5e   # checked on the hub 2026-10-18 (colbert-ai format, 96-d)
    fallback_dense_id: null         # null = dense cosine with models.embedder
    max_length: 512
    batch_size: 32
  reranker:                       # plan §0.2 #8 step 3
    id: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e   # checked on the hub 2026-10-18
    upgrade_candidate_id: Qwen/Qwen3-Reranker-8B
    max_length: 512
    batch_size: 32
  student:                        # plan §0.2 #7, used only when presence.head = finetune (full tier)
    id: answerdotai/ModernBERT-large
    fallback_id: microsoft/deberta-v3-large
    cheap_baselines: [answerdotai/ModernBERT-base, bge-m3+logreg]
    max_length: 512
    batch_size: 16
    lr: 3.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.06
    epochs: 5
    early_stopping_holdout: 0.10
    early_stopping_patience: 2
    calibration: temperature

# ---------------------------------------------------------------- schema induction (Phase 3)
genre_info:                       # data, not code: how prompts refer to each genre's documents
  privacy:
    document_kind: website privacy policy
    author_role: the company
  papers:
    document_kind: research paper in computational linguistics or machine learning
    author_role: the authors

induce:
  stage: eye_test                 # eye_test (3.1) | extract (3.2) | cluster, name (3.3) | coverage (3.5)
  prompt: induce_extract
  max_assertions: 12
  max_tokens: 1200
  batch_size: 8
  eye_test:
    sections_per_genre: 20
    selection: prompts/eval/induce_extract_eye_test.json   # tracked: section ids only, text comes from data/processed
    min_chars: 200
    max_chars: 3000
    compare_with: null            # run dir of an earlier eye test (e.g. the local 7B run): side-by-side page
  extract:                        # plan §3.2
    documents_per_genre: 500      # stratified by year x category
    split: dev
    min_section_chars: 40
  cluster:                        # plan §3.3, first half (no teacher)
    claims:                       # extract-stage output, recorded run (32B, decision record 002)
      privacy: runs/extract_32b_privacy_s0/claims_privacy.jsonl
      papers: runs/extract_32b_papers_s0/claims_papers.jsonl
    exclude_docs: [unarxive:2110.04947]   # the one partial paper (35/47 sections), dropped 2026-10-13
    embed_batch_size: 128         # claims are one sentence
    center_by_document: 1.0       # subtract this times the document's mean claim vector (0 = off): removes topic
    embed_prompt: induce_cluster_embed   # instruction for the (instruction-aware) embedder; null = plain embedding
    reduce:
      method: umap                # pca | umap | none; PCA-32 left 68-95% of claims as noise (run cluster_pca32_s0)
      dims: 10
      n_neighbors: 15             # umap only
      min_dist: 0.0               # umap only: tight clumps suit density clustering
    grid:                         # swept while schema.hdbscan.min_cluster_size is null
      min_cluster_size: [40, 60, 80, 100, 120, 160]
      min_samples: [5, 10]
      selection: [eom]            # leaf left more noise than eom at every size (run cluster_umap10_s0)
    max_cluster_share: 0.10       # a setting whose largest cluster holds more of the claims is not eligible
  relink:                         # stage relink: claims -> rebuilt sections after long sections were split
    old_sections:                 # the sections file each genre's claims were extracted from (null: not needed)
      papers: data/processed/_backup_papers_unsplit_2026-10-15/sections.jsonl
  name:                           # plan §3.3, second half
    prompt: induce_name
    from_run: null                # a cluster run directory, e.g. runs/cluster_s0
    claims_per_cluster: 20        # shown to the teacher: 10 most typical + 10 random members
    max_tokens: 400
    limit: null                   # name only the first N clusters per genre (prompt iteration); never writes the pack
    write_pack: true              # a full run writes packs/<genre>/schema_draft.yaml
  review:                         # plan §3.4: the workbook for the human pass
    cluster_run: null
    name_run: null                # may contain {genre}, e.g. runs/name_72b_{genre}_s0
    proposals: reports/schema_review/proposals_{genre}.yaml
    seeds: packs/{genre}/seeds.yaml
    out_dir: reports/schema_review
    noise_sample: 100
  candidate:                      # plan §3.4 read-back
    workbook: reports/schema_review/schema_review_{genre}.xlsx
    cluster_run: null             # the cluster run the workbook was built from
  coverage:                       # plan §3.5 (sample size and bar: schema.coverage_check_sections, max_unmapped_fraction)
    prompt: induce_coverage
    schema: packs/{genre}/schema_candidate.yaml
    exclude_sample: runs/extract_32b_{genre}_s0/sample_{genre}.json   # documents the schema was induced from
    max_tokens: 1200
    verify_prompt: induce_coverage_verify
    verify_top_k: 6               # second look: candidate types shown for a statement mapped to "none"
    verify_max_tokens: 60
  freeze:                         # plan §3.6
    coverage_run: null
    signed_off_by: null           # e.g. "Parsa Hosseini, 2026-10-14": the reviewer's explicit sign-off

schema:
  sample_documents: 500           # stratified by date and category, from dev
  min_types: 40
  max_types: 60
  target_clusters: [60, 120]
  hdbscan:
    min_cluster_size: null        # Phase 3.3: tuned so target_clusters emerge (null = sweep induce.cluster.grid)
    min_samples: null
    cluster_selection_method: eom
    metric: euclidean             # on L2-normalised embeddings
  representative_claims: 3
  positive_examples: 2
  near_misses: 1
  severity_weight_default: 1.0
  severity_weight_legal: 1.5      # privacy: GDPR Art. 13/14 or CCPA requirements
  coverage_check_sections: 100
  max_unmapped_fraction: 0.05     # GATE 3.6

# ---------------------------------------------------------------- presence (Phase 4)
distil:
  stage: labels                   # labels | select | teacher_labels (4.1, 4.2) | later stages of Phase 4
  label_sections_per_genre: 2000  # lean: teacher labels only where no human labels exist (plan §4.1); full = 5000
  human_set_per_genre: 300
  label_sets:                     # stage select -> packs/<genre>/label_sets.json (tracked: ids + text sha1)
    min_chars: 80                 # = segment.min_section_chars
    exclude_sample: runs/extract_32b_{genre}_s0/sample_{genre}.json   # documents the schema was induced from
    annotated_per_document: 10    # genre with human annotations: the human set takes this many sections from each of
                                  # randomly drawn whole annotated documents (as many as 300 needs); the teacher set
                                  # comes from the other annotated documents, so no document is in both
  teacher_labels:                 # stage teacher_labels (plan §4.1); the teacher labels every type of the schema
    sets: [teacher, human]        # which label sets to label
    limit: null                   # first N sections of each set (prompt iteration)
    sample: null                  # a seeded random N of each set instead (calibration)
    max_assertions: 12
    max_tokens: 1500
    check_max_tokens: 400
    k_claim: 2                    # second look: per first-pass statement, the k most similar types not found
    k_section: 4                  # ... and the section's k most similar types not found
    max_candidates: 8
  profiles:                       # stage profiles (4.7)
    splits: [train]               # the indexable corpus (plan §2.7)
    chunk_documents: 500          # one Parquet part per chunk; finished parts are skipped on a rerun
    limit: null                   # first N documents (smoke)
    out: null                     # null: packs/<genre>/profiles; smoke runs write elsewhere, e.g. runs/x/{genre}
  gate:                           # stage gate (4.8)
    profiles_run: null            # the run whose metrics hold the profiles' throughput, e.g. runs/profiles_v1_s0
  score:                          # stage score: teacher labels vs a reference, per type
    name: opp115                  # table name: reports/tables/teacher_vs_<name>_<genre>.csv
    teacher: null                 # e.g. runs/<run>/teacher_labels_{genre}.jsonl
    reference: null               # e.g. runs/labels_opp115_s0/labels_{genre}.jsonl, or page answers (jsonl)
    min_positives: 1              # macro F1 over types with at least this many reference positives
  min_teacher_f1: 0.85            # per type with >= min_type_positives (plan §4.2)
  min_type_positives: 20

presence:
  head: linear                    # linear (lean) | setfit | finetune (full); plan §0.2 #7, §4.3
  labels:                         # inputs of 4.3-4.8 (labels made under the schema version they name; projected)
    teacher: runs/label_72b_s0_20261018-195259-515194/teacher_labels_{genre}.jsonl      # 72B, teacher + reference sets
    reference: runs/judge_haiku_s0_20261017-004935-303611/teacher_labels_{genre}.jsonl  # silver reference (4.2)
    annotations:                  # human labels mapped through label_source (4.1)
      privacy: runs/labels_opp115_s0/labels_privacy.jsonl
  train_labels: teacher           # teacher: teacher labels for every type (lean, 2026-10-18, decision record 005)
                                  # | plan: annotations where a type has a label_source rule, teacher otherwise
  cascade:
    reranker: false               # lean: classifier + prototypes (4.6: the reranker added +0.002 / -0.004 at 5-9x the
                                  # time); true = the full cascade of §0.2 #8 for profiles and the pipeline
  gate:
    relative_to_ceiling: 0.80     # 4.8: presence macro F1 >= this x the teacher's own macro F1 vs the reference
    min_positives: 5              # macro F1 over types with at least this many reference positives (eval half)
  reference_split_seed: 1234      # whole reference documents -> fit half (calibration, thresholds, combiner) / eval half
  label_sources:                  # per pack: where presence labels come from (plan §4.1)
    privacy: opp115               # human annotations mapped through schema label_source
    papers: teacher
  linear:
    C: 1.0
    C_grid: [0.1, 0.3, 1.0, 3.0, 10.0]   # 4.3: C chosen per pack by macro F1 on the reference fit half (null = C)
    class_weight: balanced
  setfit:
    pairs_per_type: 200
    epochs: 1
    lr: 2.0e-5
  prototypes_per_type: [10, 30]
  band:                           # Phase 4.5: fixed per pack from the similarity distributions
    low: null                     # null: computed by distil.stage cascade (recorded in packs/<genre>/cascade.json)
    high: null
    quantiles: [0.05, 0.95]       # low = this quantile of labelled positives, high = of labelled negatives
  combine: logistic               # classifier prob + cascade score
  threshold: null                 # Phase 4: calibrated P(present) cut-off
  target_macro_f1: 0.80           # GATE 4.8

# ---------------------------------------------------------------- retrieval and expectation (Phase 5)
index:
  backend: faiss                  # faiss (development) | qdrant (production)
  faiss:
    kind: hnsw
    M: 32
    ef_construction: 200
    ef_search: 128
  qdrant:
    url: null                     # null + path -> embedded local mode
    path: null
    collection_prefix: negspace
    hnsw_m: 16
    hnsw_ef_construct: 100

cohort:
  k: 200                          # plan §0.2 #10
  category_filter: true
  date_window: null               # [start, end] ISO dates
  fallback_unfiltered: true       # when the filtered pool is smaller than k

expectation:
  level: 1                        # 1 = cohort prevalence, 2 = MAM (Phase 8)
  wilson_z: 1.96

rank:
  top_k: 10
  threshold: null                 # report all above this score on request
  use_severity_weights: true
  tie_break: prevalence

evidence:
  max_peer_sentences: 5
  attribution_top_types: 3

explain:
  mode: template                  # template (lean, no LLM on the hot path) | teacher (full, opt-in in the UI)
  top_n: 5
  max_tokens: 256

# ---------------------------------------------------------------- masked-assertion model (Phase 8)
mam:
  d_model: 256
  n_layers: 4                     # plan: 4-6
  n_heads: 8
  dropout: 0.1
  mask_rate: [0.15, 0.40]         # random rate per example
  no_mask_fraction: 0.10
  negative_weight: 0.1            # down-weight for absent-type targets
  metadata_tokens: [category, year_bucket]
  year_bucket_size: 2
  lr: 3.0e-4
  weight_decay: 0.01
  batch_size: 256
  max_epochs: 50
  early_stopping_metric: dev_masked_auroc
  early_stopping_patience: 5
  calibration: temperature

# ---------------------------------------------------------------- OmitBench (Phases 6 and 9)
bench:
  regimes: [single_type, three_types, whole_section]
  instances_per_regime: 500
  recall_ks: [1, 5, 10]
  ndcg_k: 10
  false_alarm_top: 5
  ece_bins: 15
  bootstrap_samples: 1000
  ci: 0.95
  ablation_k: [20, 50, 200, 1000]
  real:                           # plan §0.2 #16
    source: revision              # revision (lean: natural omissions from version chains) | annotation (full)
    min_added_prevalence: 0.5     # an added type counts only if >= this fraction of time-windowed peers state it
    validation_documents_per_genre: 50
    validation_annotators: 2
    min_validation_precision: 0.7 # below this, fall back to source: annotation for that genre (plan §9.2)
    annotation_documents_per_genre: 150
    annotation_annotators: 2

baselines:
  models: []                      # filled in configs/baselines.yaml; API keys only via env vars
  runs_per_model: 3
  llm_gap_instances: 100          # plan §7.3
  batch_pricing: true             # use providers' batch endpoints where available
  rag_peers: 5                    # baseline (f): cohort peers in context; full = 20
  open_ended_mapping: embedding   # how (d) outputs map to schema types: embedding (lean) | teacher (full)

drift:
  windows: null                   # per genre, configs/drift.yaml

onthefly:
  pack_similarity_threshold: null # Phase 10.2
  cohort_documents: 100

serve:
  host: 127.0.0.1
  port: 7860
  max_upload_mb: 20
  store_uploads: false            # plan §0.2 #21: uploads are never stored

tracking:
  wandb: false
  wandb_project: negspace

# ---------------------------------------------------------------- Mac <-> Colab store (plan §0.6, 2026-10-18)
hub:                              # python -m experiments.hub_sync push|pull --bundles ...
  repo: parsa-hke/negative-space-reader-data   # private Hugging Face dataset repo
  bundles:
    data:
      include: ["data/processed/privacy/*", "data/processed/papers/*", "data/processed/splits/*"]
      exclude: ["data/processed/papers/_extract*", "data/processed/_backup*"]
    embeddings:
      include: ["data/embeddings/*"]
      exclude: ["data/embeddings/*/_sections_unsplit*"]
    cache:
      archive: .cache/negspace/teacher   # ~22k small response files travel as one archive
    packs:
      include: ["packs/*/classifier/*", "packs/*/prototypes/*", "packs/*/profiles/*", "packs/*/cascade*.json"]
      exclude: []
    runs:
      include: ["runs/*/*"]           # run folders; runs/log.csv is merged separately (hub_sync push_log/pull_log)
      exclude: ["runs/log.csv*", "runs/*.out"]

